openapi: 3.1.0
info:
  title: DataForGood API
  version: "1.0"
  description: |
    Route handlers de `app/api`. Las acciones del panel del SuperUsuario
    (`/sistema`, `/usuarios`, `/supervisar`) son server actions y no aparecen aquí.

    **Sesión de usuario:** se maneja con la cookie `session_token` (httpOnly). Ejecuta
    primero `POST /api/auth/login`; el navegador (o Insomnia) guarda la cookie
    y la manda sola en las siguientes peticiones.

    **SuperUsuario:** ejecuta `POST /api/auth/root/token` con la credencial de
    SuperUsuario del entorno (`ROOT_USER_ID` y su contraseña), copia `data.token`,
    pulsa **Authorize** y pégalo en `rootBearer`. Vale 2 horas. Con él responden
    `GET /api/usuarios` (todos los usuarios) y `GET /api/usuarios/{id}` (cualquier id).
    El resto de las rutas son de la cuenta de un usuario y piden `session_token`.

    **CSRF:** las mutaciones con un header `Origin` de otro sitio responden
    403 `Origen no permitido` (`proxy.ts`).

    Todas las respuestas JSON son `{ data }`, `{ message, data }` o `{ error }`.

    Este archivo se mantiene a mano: si cambias una ruta, actualízalo en el mismo commit.
# /api/docs/spec agrega al inicio el servidor desde el que se abre la página.
servers:
  - url: http://localhost:3000/dataforgood
    description: Docker local
  - url: http://localhost:3000
    description: next dev
  - url: https://multimodal-ai-lab.cicese.mx/dataforgood
    description: Producción

tags:
  - name: Auth
  - name: Campañas
  - name: Aportes
  - name: Usuarios
  - name: Revisiones y notificaciones
  - name: Datos abiertos

security:
  - sessionCookie: []

paths:
  # ---------------------------------------------------------------- Auth
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión con correo y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
            example: { email: usuario@correo.com, password: contraseña }
      responses:
        "200":
          description: Sesión iniciada. Guarda la cookie `session_token`. Una cuenta suspendida o baneada también la obtiene, pero la API la trata como sin sesión (401) y la app la manda a `/cuenta-bloqueada`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/User" }
                  bajaCancelada: { type: boolean, description: "true si la cuenta tenía una baja en curso: iniciar sesión la canceló" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Correo o contraseña incorrectos, correo inexistente o cuenta solo de Google (misma respuesta para no revelar qué correos existen)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cuenta suspendida, baneada o sin verificar (en ese caso guarda `pending_verification_id`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      responses:
        "200": { $ref: "#/components/responses/Message" }

  /api/auth/sesion:
    get:
      tags: [Auth]
      summary: Usuario de la sesión actual
      responses:
        "200":
          description: Usuario en sesión
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/verificar:
    get:
      tags: [Auth]
      summary: Consultar la verificación de correo pendiente
      description: Usa la cookie `pending_verification_id` que dejan el registro o el login.
      security: [pendingVerificationCookie: []]
      responses:
        "200": { description: Datos de la verificación pendiente }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Auth]
      summary: Verificar el correo con el código recibido
      security: [pendingVerificationCookie: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/auth/verificar/reenviar:
    post:
      tags: [Auth]
      summary: Reenviar el código de verificación
      security: [pendingVerificationCookie: []]
      responses:
        "200":
          description: Código reenviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      expiresAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/auth/recuperar:
    post:
      tags: [Auth]
      summary: Pedir el código para recuperar la contraseña
      description: |
        Sin sesión. Responde lo mismo exista o no la cuenta; si existe, genera un código de 6 dígitos
        (vence en 15 minutos, 3 intentos) y lo envía por correo después de responder. A una misma cuenta
        se le envía como máximo un código cada 30 segundos (los pedidos de antes se ignoran en silencio; usar el código reinicia la espera).
        Una cuenta solo de Google también lo recibe y con él crea su contraseña.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
            example: { email: persona@correo.com }
      responses:
        "200":
          description: Pedido recibido (no indica si el correo tiene cuenta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/auth/recuperar/restablecer:
    post:
      tags: [Auth]
      summary: Cambiar la contraseña con el código del correo
      description: |
        Sin sesión. Si el código es correcto guarda la contraseña nueva (mismas reglas que el registro),
        quita el bloqueo por intentos fallidos, marca el correo como verificado, cierra todas las sesiones
        de la cuenta y quita sus avisos push. No abre sesión. Todo código inválido, vencido o agotado
        (y un correo sin cuenta) da el mismo error 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, codigo, nueva]
              properties:
                email: { type: string, format: email }
                codigo: { type: string, pattern: "^\\d{6}$" }
                nueva: { type: string, format: password }
            example: { email: persona@correo.com, codigo: "123456", nueva: "Nueva#2026" }
      responses:
        "200":
          description: Contraseña cambiada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/auth/google:
    get:
      tags: [Auth]
      summary: Iniciar sesión con Google (redirección OAuth)
      description: Pruébalo en el navegador; redirige a Google y regresa a `/api/auth/google/callback`.
      parameters:
        - name: next
          in: query
          required: false
          description: Pantalla interna a la que volver tras iniciar sesión (p. ej. `/campanas/12`). Si no es una ruta interna válida se usa `/campanas`.
          schema: { type: string }
      security: []
      responses:
        "307": { description: Redirección a Google }

  /api/auth/google/callback:
    get:
      tags: [Auth]
      summary: Regreso de Google OAuth
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "307": { description: "Redirige a la pantalla de `next` (o a `/campanas`), o a `/entrar?error=...`" }

  /api/auth/root:
    post:
      tags: [Auth]
      summary: Iniciar sesión como SuperUsuario
      description: |
        Guarda la cookie `root_session_token` (2 horas). Límite: 5 intentos por
        minuto por IP y 30 por minuto en total. Cada intento queda en `audit_log`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identificador, credencial]
              properties:
                identificador: { type: string }
                credencial: { type: string, format: password }
      responses:
        "204": { description: Sesión raíz creada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Demasiados intentos }

  /api/auth/root/token:
    post:
      tags: [Auth]
      summary: Obtener el token Bearer del SuperUsuario
      description: |
        Misma credencial y mismo límite de intentos que `POST /api/auth/root`, pero no guarda
        cookie: devuelve un token que vale 2 horas. Pégalo en **Authorize** → `rootBearer`
        (o mándalo como `Authorization: Bearer <token>`). Se registra en `audit_log` como
        `root.token_api`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identificador, credencial]
              properties:
                identificador: { type: string, description: Valor de ROOT_USER_ID }
                credencial: { type: string, format: password }
      responses:
        "201":
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string, example: 64 caracteres hexadecimales }
                      tipo: { type: string, example: Bearer }
                      expiraEn: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Demasiados intentos }

  # ---------------------------------------------------------------- Usuarios
  /api/usuarios:
    post:
      tags: [Usuarios]
      summary: Registro de cuenta
      description: Envía el código de verificación por correo y guarda la cookie `pending_verification_id`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistroInput" }
      responses:
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: El correo ya está registrado
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    get:
      tags: [Usuarios]
      summary: Listar los usuarios del sistema (SuperUsuario) o buscar candidatos a revisor
      description: |
        - **SuperUsuario** (token `rootBearer` o cookie de /root): todos los usuarios del sistema,
          20 por página, del más reciente al más antiguo. Filtros opcionales: `q`, `rol`, `estado`, `pagina`.
        - **Usuario** (`session_token`): lista de "agregar revisor". Exige `campanaId` (y ser su
          creador). Sin `q`, todas las cuentas verificadas (menos la suya), 30 por página por nombre;
          `q` filtra por nombre y apellidos desde la primera letra (sin importar acentos), o por correo
          solo si es completo y exacto. El correo siempre va oculto.
      security:
        - rootBearer: []
        - sessionCookie: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "SuperUsuario: nombre, apellidos, correo o id. Usuario: parte del nombre y apellidos, o el correo completo" }
        - { name: rol, in: query, required: false, schema: { type: string, enum: [usuario, supervisor, revisor] }, description: Solo SuperUsuario }
        - { name: estado, in: query, required: false, schema: { type: string, enum: [ACTIVA, CON_STRIKES, SUSPENDIDA, BANEADA] }, description: Solo SuperUsuario }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 }, description: "SuperUsuario: 20 por página. Usuario: 30 por página" }
        - { name: campanaId, in: query, required: false, schema: { type: integer }, description: Solo usuario (obligatorio para él) }
      responses:
        "200":
          description: Usuarios (SuperUsuario) o candidatos (usuario)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Directorio (SuperUsuario)
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            nombre: { type: string, description: Nombre y apellidos }
                            correo: { type: string }
                            rol: { type: string, description: "Rol principal, legible" }
                            roles: { type: array, items: { type: string } }
                            estado: { type: string, enum: [ACTIVA, CON_STRIKES, SUSPENDIDA, BANEADA] }
                            strikes: { type: integer }
                      pagina: { type: integer }
                      porPagina: { type: integer }
                      total: { type: integer }
                      totalPaginas: { type: integer }
                  - type: object
                    title: Candidatos a revisor (usuario)
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            nombre: { type: string }
                            apellidos: { type: string }
                            emailOculto: { type: string, example: "an***@correo.com" }
                            role: { type: array, items: { type: string } }
                      total: { type: integer, description: Cuántos coinciden en total }
                      pagina: { type: integer }
                      hayMas: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/usuarios/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Usuarios]
      summary: Perfil de un usuario
      description: |
        Un usuario solo ve su propia cuenta (401 sin sesión, 403 con otro id). El SuperUsuario
        (`rootBearer`) ve cualquier id; para listarlos todos usa `GET /api/usuarios`.
      security:
        - rootBearer: []
        - sessionCookie: []
      responses:
        "200":
          description: Usuario (columnas de la tabla, en snake_case)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Usuarios]
      summary: Editar el propio perfil
      description: |
        Las llaves que no se mandan no se tocan. `intereses` son temáticas del catálogo
        (`GET /api/tematicas`); una que no existe responde 400 (desde el 2026-10-20 ya no se da de
        alta). Máximo 20. Una temática oculta o pendiente solo se conserva si ya estaba en el perfil. `interesesTexto` es lo que la persona escribió
        sobre sus gustos (máx. 500; "" lo borra): de ahí la app saca los intereses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string }
                apellidos: { type: string }
                state: { type: string }
                city: { type: string }
                specialty: { type: string }
                intereses: { type: array, items: { type: string }, maxItems: 20 }
                interesesTexto: { type: string, maxLength: 500 }
            example: { interesesTexto: "Me gusta andar en bici y la fotografía", intereses: [Movilidad, Cultura] }
      responses:
        "200": { description: Perfil actualizado (con `intereses` ya con el nombre del catálogo) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [Usuarios]
      summary: Pedir la baja de la propia cuenta
      description: |
        Solo la cuenta propia. Exige `confirmacion: "ELIMINAR"` y, si la cuenta tiene contraseña,
        `contrasena` (una equivocada suma al bloqueo del login, 423 al llegar a 5). Las cuentas de
        Google no la mandan. Efectos inmediatos: se cierran todas las sesiones, las campañas propias
        activas o pausadas se finalizan y las que no tienen aportes (y no están finalizadas) se borran.
        A los 30 días se aplica `destino` a los aportes y la cuenta se vacía de datos personales;
        iniciar sesión antes lo cancela. Los aportes aceptados en campañas finalizadas nunca se borran
        (con `eliminar` se anonimizan). Bitácora: `usuario.baja_solicitar`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destino, confirmacion]
              properties:
                destino: { type: string, enum: [eliminar, anonimizar, autoria] }
                confirmacion: { type: string, enum: [ELIMINAR] }
                contrasena: { type: string, format: password, description: Obligatoria si la cuenta tiene contraseña }
            example: { destino: anonimizar, confirmacion: ELIMINAR, contrasena: "Contraseña123!" }
      responses:
        "200":
          description: Baja registrada; la cookie de sesión se borra
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      efectivaEn: { type: string, format: date-time }
                      campanasFinalizadas: { type: integer }
                      campanasBorradas: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "423":
          description: Demasiados intentos fallidos; la cuenta está bloqueada temporalmente
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/usuarios/{id}/contrasena/codigo:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Usuarios]
      summary: Enviar el código para poner contraseña con la sesión abierta
      description: |
        Solo la cuenta propia (403 con otro id). Es lo que usa /cuenta para cambiar la contraseña sin
        pedir la actual, o para crearla en una cuenta de Google. Manda al correo
        de la cuenta un código de 6 dígitos (vence en 15 minutos, 3 intentos). Como máximo uno cada
        30 segundos (429 con `Retry-After`; el código anterior sigue sirviendo).
      responses:
        "200":
          description: Código enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { email: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { description: Ya se envió un código hace menos de 30 segundos, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/usuarios/{id}/contrasena:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Usuarios]
      summary: Poner la contraseña con el código del correo
      description: |
        Solo la cuenta propia. Con el código de `POST /api/usuarios/{id}/contrasena/codigo` y la
        contraseña (mismas reglas que el registro). Una cuenta de Google la crea (desde entonces entra
        con correo y contraseña o con Google); una con contraseña la cambia sin escribir la actual. Las
        sesiones abiertas se conservan. Todo código inválido, vencido o agotado da el mismo 400. Se
        registra en audit_log como `usuario.contrasena_crear` o `usuario.contrasena_cambiar` (con `conCodigo`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, nueva]
              properties:
                codigo: { type: string, pattern: "^\\d{6}$" }
                nueva: { type: string, format: password }
      responses:
        "200":
          description: Contraseña guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      creoContrasena: { type: boolean, description: true si la cuenta no tenía contraseña }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Usuarios]
      summary: Cambiar la propia contraseña
      description: |
        Solo la cuenta propia (403 con otro id) y solo si tiene contraseña (400 si es de Google).
        `nueva` debe tener 8 caracteres o más (y como máximo 72 bytes), una mayúscula, un número y
        un carácter especial, y ser distinta de `actual`. Una `actual` equivocada suma un intento
        fallido al mismo contador del login: con 5 la cuenta queda bloqueada 15 minutos (423).
        Las sesiones abiertas se conservan. Se registra en audit_log como `usuario.contrasena_cambiar`.
        Desde el 2026-10-07 ninguna pantalla lo usa (/cuenta cambia con código); queda para clientes de la API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual, nueva]
              properties:
                actual: { type: string, format: password }
                nueva: { type: string, format: password }
      responses:
        "200":
          description: Contraseña cambiada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { ok: { type: boolean } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423":
          description: Demasiados intentos fallidos; la cuenta está bloqueada temporalmente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/usuarios/{id}/avatar:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Usuarios]
      summary: Foto de perfil de la cuenta propia
      description: |
        JPEG cuadrado de 256 px. Solo la cuenta propia (hoy no se muestra a nadie más). 404 si la
        cuenta usa las iniciales o un ícono predefinido. La app la pide con `?v=<versión>`, que cambia
        con cada foto nueva, así que se puede guardar en caché.
      responses:
        "200":
          description: La foto
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Usuarios]
      summary: Cambiar el ícono del perfil
      description: |
        Solo la cuenta propia. Las iniciales, un ícono predefinido o una foto propia. La foto (JPG o PNG
        de hasta 5 MB, se revisa su firma) se recorta a 256 px y se guarda sin metadatos en MinIO
        (`perfiles/<id>/`). Elegir otra opción borra la foto anterior.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  enum: [iniciales, masculino, femenino, otro, foto]
                file:
                  type: string
                  format: binary
                  description: Obligatorio con `avatar=foto`. .jpg, .jpeg o .png, máximo 5 MB
      responses:
        "200":
          description: Ícono actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      usuarioId: { type: integer }
                      nombre: { type: string }
                      avatar: { type: [string, "null"], enum: [masculino, femenino, otro, foto, null] }
                      version: { type: [string, "null"], description: Va en la URL de la foto }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- Campañas
  /api/campanas:
    get:
      tags: [Campañas]
      summary: Listar campañas
      description: "Usa uno de los filtros a la vez. Sin filtros (y con `id`) solo devuelve lo que quien consulta puede ver (`lib/campanas/visibilidad.ts`, 2026-10-20): cualquiera ve las activas, pausadas y finalizadas; el creador, las suyas; un supervisor, además las que están en revisión y las que supervisa; el revisor aceptado, esa campaña; la sesión raíz, todas. Con `id` de una que no puede ver responde 404."
      security: []
      parameters:
        - { name: id, in: query, schema: { type: integer }, description: "Una sola campaña. La respuesta trae además `viewer: { isCreator, isMySupervision, baneado, motivoDeBaneo, yaReportada }` (`baneado`: el creador te baneó de esta campaña; `yaReportada`: ya la reportaste)" }
        - { name: available, in: query, schema: { type: boolean }, description: Campañas en las que puedo aportar (excluye aquellas de las que el creador me baneó) }
        - { name: mine, in: query, schema: { type: boolean }, description: Campañas que creé (requiere sesión) }
        - { name: supervised, in: query, schema: { type: boolean }, description: Campañas que superviso (requiere sesión) }
        - { name: misAportes, in: query, schema: { type: boolean }, description: "Campañas donde aporté, con `myContributionsCount`" }
      responses:
        "200":
          description: Campañas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Campaign" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Campañas]
      summary: Crear campaña
      description: |
        Exige sesión: la campaña es de quien la crea. `status` solo `borrador` (por defecto) o
        `en_revision`; con 5 campañas activas, solo `borrador`. Contadores, XP, `isSpecial` y
        `hasReviewerAssigned` del body se ignoran.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "201": { $ref: "#/components/responses/CampaignResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/campanas/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Campañas]
      summary: Detalle de campaña
      description: "Pública solo si está activa, pausada o finalizada; en otro estado, solo para el creador, los supervisores (en revisión o la que supervisa), su revisor aceptado o la sesión raíz. Al resto le responde 404 (lib/campanas/visibilidad.ts, 2026-10-20)."
      security: []
      responses:
        "200":
          description: Campaña
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Campaign" }
                  viewer:
                    type: object
                    properties:
                      isCreator: { type: boolean }
                      isMySupervision: { type: boolean }
                      baneado: { type: boolean }
                      motivoDeBaneo: { type: [string, "null"] }
                      yaReportada: { type: boolean, description: "Ya reportaste esta campaña (POST /api/campanas/{id}/reportar)" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Campañas]
      summary: Editar campaña completa (solo el creador)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "200": { $ref: "#/components/responses/CampaignResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Campañas]
      summary: Edición parcial o decisión del supervisor
      description: |
        - **Creador:** manda solo los campos a cambiar (mismos nombres que `CampaignInput`).
          Los campos permitidos dependen del estado actual; una campaña `finalizada` es de solo lectura.
        - **Pausar y reanudar (solo el creador):** `{ "status": "pausada" }` sobre una `activa` y
          `{ "status": "activa" }` sobre una `pausada`, sin otros campos. Una pausada no recibe aportes
          ni aparece en las listas públicas. Reanudar da 400 si su fecha de cierre ya pasó o si el
          creador ya tiene 5 campañas activas. Si la pausó la supervisión, el creador no la reanuda (403).
        - **Supervisor:** `{ "action": "tomar" }` para tomarla, o `{ "action": "aceptada" }` /
          `{ "action": "rechazada", "motivoDeLista": "...", "motivo": "...", "sancion": { "tipo": "...", "dias": 2 } }`
          para decidir. Al rechazar: `motivoDeLista` (uno de los motivos de reportar campaña u "Otro") y/o `motivo`
          (explicación, hasta 500; obligatoria con "Otro"). `sancion` es opcional: `STRIKE` (aviso, sigue la escala),
          `SUSPENSION_TEMPORAL` con `dias` 2 o 7, o `BANEO_DE_CAMPANA`; deja un reporte ya resuelto en la
          bandeja de la supervisión. `reportada` ya no se acepta (2026-10-16).
        - **Supervisor que la supervisa (2026-10-15):** `{ "action": "pausar" | "finalizar", "motivo": "..." }`
          (motivo obligatorio, hasta 500 caracteres) sobre una activa (pausar) o activa/pausada (finalizar), y
          `{ "action": "reanudar" }` sobre una que pausó la supervisión. Avisa al creador con el motivo.
          409 si la campaña cambió de estado mientras tanto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CampaignInput"
                - type: object
                  title: Acción de supervisor
                  required: [action]
                  properties:
                    action: { type: string, enum: [tomar, aceptada, rechazada, pausar, reanudar, finalizar] }
                    motivo: { type: string, maxLength: 500 }
                    motivoDeLista: { type: string, description: "Solo al rechazar: motivo de la lista." }
                    sancion:
                      type: object
                      description: Solo al rechazar. Sanción al creador.
                      required: [tipo]
                      properties:
                        tipo: { type: string, enum: [STRIKE, SUSPENSION_TEMPORAL, BANEO_DE_CAMPANA] }
                        dias: { type: integer, enum: [2, 7], description: Solo con SUSPENSION_TEMPORAL. }
            examples:
              finalizar: { value: { status: finalizada } }
              pausar: { value: { status: pausada } }
              reanudar: { value: { status: activa } }
              tomar: { value: { action: tomar } }
              rechazar: { value: { action: rechazada, motivoDeLista: Pide datos personales o sensibles, motivo: Pide la CURP de cada participante } }
              rechazarConSancion: { value: { action: rechazada, motivoDeLista: Engaño o fraude, pide datos para otro fin, sancion: { tipo: SUSPENSION_TEMPORAL, dias: 2 } } }
              pausarComoSupervisor: { value: { action: pausar, motivo: Pide datos personales en la descripción } }
              reanudarComoSupervisor: { value: { action: reanudar } }
      responses:
        "200": { $ref: "#/components/responses/CampaignResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La campaña cambió de estado mientras tanto (pausar, reanudar o finalizar de la supervisión)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/campanas/{id}/reportar:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Campañas]
      summary: Reportar una campaña (cualquier persona con sesión, salvo el creador)
      description: |
        El reporte va contra quien creó la campaña y llega a la bandeja del SuperUsuario (/reportes),
        que lo descarta o lo confirma con un aviso (escala: mensaje, 2 días, 7 días, baneo y lista negra),
        que queda en el registro de sanciones. El creador no se entera del reporte ni sabe quién lo hizo. Motivo de la lista y/o descripción (al menos
        uno). Uno por persona y campaña. Un borrador responde 404. Bitácora `campana.reportar`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
                  enum:
                    - Contenido ofensivo o inapropiado
                    - "Engaño o fraude: pide datos para otro fin"
                    - Pide datos personales o sensibles
                    - Información falsa o engañosa
                    - Spam o publicidad
                    - Pone en riesgo a quien participa
                descripcion: { type: string, maxLength: 500 }
      responses:
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ya reportaste esta campaña
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/usuarios/{id}/preferencias:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Usuarios]
      summary: Preferencias de notificaciones (cuenta propia)
      description: |
        Una o varias de las opciones de "Comunicación y notificaciones" (booleanos), incluido el interruptor
        general `notificaciones` (2026-10-19). Cualquier otra llave o un valor que no sea booleano da 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                avisosCampanasNuevas: { type: boolean, description: Campañas nuevas y especiales por temática y zona }
                avisosAportes: { type: boolean, description: Aporte aceptado o rechazado }
                recordatorioSemanal: { type: boolean, description: "Lunes 9:00: cuota pendiente" }
                resumenMensual: { type: boolean, description: "Día 1, 9:00: resumen del mes" }
                notificaciones: { type: boolean, description: "Interruptor general: false = ninguna notificación salvo rol, sanciones e invitación de revisor" }
      responses:
        "200": { description: Guardado }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/campanas/{id}/especial:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Campañas]
      summary: Hacer especial o cambiar sus incentivos
      description: |
        Solo el creador y solo con la campaña `activa` o `pausada`. El periodo va dentro de la
        vigencia de la campaña y no puede haber terminado; multiplicador de 1 a 3; insignia opcional
        (solo el nombre, hasta 40 caracteres). El bono por cuota (300 XP) es fijo. Guarda la
        configuración: otorgar el XP lo hace la gamificación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inicio, fin, multiplicador]
              properties:
                inicio: { type: string, format: date }
                fin: { type: string, format: date }
                multiplicador: { type: integer, minimum: 1, maximum: 3 }
                insignia: { type: string, maxLength: 40 }
            example: { inicio: "2026-10-15", fin: "2026-10-22", multiplicador: 2, insignia: Guardián verde }
      responses:
        "200": { description: Campaña especial publicada, content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Campañas]
      summary: Quitar los incentivos
      responses:
        "200": { description: Se quitaron los incentivos, content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/campanas/{id}/inscripcion:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Campañas]
      summary: Inscribirse a la campaña para aportar
      description: |
        Acepta una sola vez el acuerdo de confirmación (el aporte corresponde a la campaña y no
        tiene contenido inadecuado) y el de uso del aporte (se usa para la campaña y, si se
        aprueba, se publica como dato abierto CC BY 4.0 sin nombre ni correo). POST /api/aportes
        lo exige. Campaña activa o pausada; no su creador ni alguien baneado. Repetirla no cambia
        nada. Bitácora `campana.inscribirse`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmaContenido, aceptaUso]
              properties:
                confirmaContenido: { type: string, enum: [si] }
                aceptaUso: { type: string, enum: [si] }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/campanas/{id}/guardar:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Campañas]
      summary: Guardar campaña
      responses:
        "200": { $ref: "#/components/responses/SavedResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Campañas]
      summary: Quitar campaña de guardadas
      responses:
        "200": { $ref: "#/components/responses/SavedResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/campanas/{id}/revisores:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Campañas]
      summary: Revisores de la campaña (solo el creador)
      responses:
        "200":
          description: Revisores
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        usuarioId: { type: string }
                        estado: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Campañas]
      summary: Invitar revisor (solo el creador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuarioId]
              properties:
                usuarioId: { type: integer }
      responses:
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ya es revisor de la campaña
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/campanas/{id}/baneos:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Campañas]
      summary: Participantes baneados y dispositivos anónimos bloqueados (solo el creador)
      responses:
        "200":
          description: Baneados, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        usuarioId: { type: string }
                        nombre: { type: string }
                        motivo: { type: string }
                        baneadoEn: { type: string, format: date-time }
                  dispositivos:
                    type: array
                    description: Dispositivos de personas sin cuenta bloqueados en esta campaña
                    items:
                      type: object
                      properties:
                        bloqueoId: { type: string }
                        aporteId: { type: [string, "null"] }
                        motivo: { type: string }
                        bloqueadoEn: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Campañas]
      summary: Quitar el baneo de un participante o desbloquear un dispositivo anónimo (solo el creador)
      description: "Manda `usuarioId` para una cuenta o `bloqueoId` para un dispositivo. Bitácora: `campana.desbanear` o `campana.desbloquear_dispositivo`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usuarioId: { type: integer }
                bloqueoId: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: La campaña no existe o esa persona no estaba baneada }
    post:
      tags: [Campañas]
      summary: Banear de la campaña a quien envió un aporte (solo el creador)
      description: |
        Si el aporte es de una cuenta, la banea de la campaña. Si es anónimo, bloquea en la
        campaña el dispositivo que lo envió (`campana.bloquear_dispositivo` en audit_log).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contributionId, reason]
              properties:
                contributionId: { type: string }
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/campanas/{id}/recoleccion-diaria:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Campañas]
      summary: Aportes aprobados por día y por tipo
      description: Solo el creador de la campaña.
      responses:
        "200":
          description: Serie diaria y reparto por tipo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        fecha: { type: string, format: date }
                        etiqueta: { type: string }
                        valor: { type: integer }
                  porTipo:
                    type: array
                    items:
                      type: object
                      properties:
                        tipo: { $ref: "#/components/schemas/DataType" }
                        etiqueta: { type: string }
                        valor: { type: integer }
                        porcentaje: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/campanas/{id}/enlace:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Campañas]
      summary: Enlace público actual de la campaña
      description: |
        Cualquier usuario con sesión (el enlace es para difundir la campaña). Devuelve el último
        enlace no revocado, vigente o caducado, o `data: null` si nunca se generó. `visitas` y
        `aportesRecibidos` solo vienen si quien pide es el creador. El enlace se genera solo cuando
        la campaña queda `activa`.
      responses:
        "200":
          description: Enlace, estado de la campaña y si quien pide es el creador
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: [object, "null"]
                    properties:
                      url: { type: string }
                      token: { type: string }
                      creadoEn: { type: string, format: date-time }
                      expiraEn: { type: string, format: date-time }
                      vigente: { type: boolean }
                      visitas: { type: integer, description: Solo para el creador }
                      aportesRecibidos: { type: integer, description: Solo para el creador }
                  campana:
                    type: object
                    properties:
                      nombre: { type: string }
                      status: { type: string }
                      permiteAnonimos: { type: boolean, description: "Si /c/{token} acepta aportes sin cuenta" }
                  viewer:
                    type: object
                    properties:
                      esCreador: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Campañas]
      summary: Generar o regenerar el enlace público
      description: |
        Solo el creador y solo con la campaña `activa`. Crea un token que vale 24 horas
        para la ruta pública /c/{token}. Si ya había uno, queda revocado para siempre
        (conserva sus visitas y aportes). Se registra en audit_log como `campana.enlace_regenerar`.
      responses:
        "201":
          description: Enlace nuevo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      creadoEn: { type: string, format: date-time }
                      expiraEn: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: La campaña no está activa
    patch:
      tags: [Campañas]
      summary: Permitir o cortar los aportes sin cuenta
      description: Solo el creador. No toca los aportes anónimos ya recibidos. Bitácora `campana.anonimos_cambiar`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permiteAnonimos]
              properties:
                permiteAnonimos: { type: boolean }
      responses:
        "200":
          description: Valor guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { permiteAnonimos: { type: boolean } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/campanas/{id}/qr:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Campañas]
      summary: Descargar el código QR del enlace público
      description: Cualquier usuario con sesión. QR de 512 × 512 px del enlace vigente, que apunta a /c/{token}.
      parameters:
        - name: formato
          in: query
          schema: { type: string, enum: [png, svg], default: png }
      responses:
        "200":
          description: Archivo del QR (como descarga)
          content:
            image/png: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: El enlace caducó; hay que regenerarlo

  # ---------------------------------------------------------------- Aportes
  /api/aportes:
    get:
      tags: [Aportes]
      summary: Aportes de una campaña
      description: Sin `mine`, solo el creador o un revisor aceptado de la campaña. En la vista de revisor se excluyen los aportes enviados por el propio revisor.
      parameters:
        - { name: campaignId, in: query, required: true, schema: { type: integer } }
        - { name: mine, in: query, schema: { type: boolean }, description: Solo mis aportes }
        - { name: reviewer, in: query, schema: { type: boolean }, description: Vista de revisor }
      responses:
        "200":
          description: Aportes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Contribution" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Aportes]
      summary: Enviar aporte con archivo
      description: |
        El archivo se sube a MinIO. Reglas: la campaña debe estar activa, no puedes
        ser su creador ni estar baneado, y no debes haber alcanzado tu cuota (se cuenta con
        candado: dos envíos simultáneos no la pasan). Si la campaña reparte la cuota por tipo
        (`cuotaPorTipo`), tampoco la de ese tipo (400 "Ya llegaste al máximo de N fotos..."). El archivo debe ser de un tipo que acepta
        la campaña (`dataTypes`) y su contenido debe coincidir con la extensión (se revisa la
        firma): foto .jpg/.jpeg/.png (10 MB), video .mp4/.mov/.webm (50 MB), audio
        .mp3/.m4a/.wav/.ogg (20 MB), documento .pdf/.docx (20 MB) y texto .txt (1 MB). Fotos y
        documentos se guardan sin metadatos (EXIF con GPS, autor...); video y audio, tal cual. Si
        la campaña acepta texto, `file` es opcional. 413 si el cuerpo pasa de 51 MB. La persona debe
        estar inscrita a la campaña (aceptó los acuerdos con POST /api/campanas/{id}/inscripcion);
        si no, 403. La hora de la inscripción se guarda en el aporte.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [campaignId, description]
              properties:
                campaignId: { type: string }
                description: { type: string, maxLength: 1000 }
                caracteristicas:
                  type: array
                  items: { type: string }
                  description: 'Respuestas de checklists ("Título: opción"); se descartan las que no existen'
                file:
                  type: string
                  format: binary
                  description: Según los tipos de la campaña (ver arriba). Opcional solo si la campaña acepta texto
                enlace:
                  type: string
                  description: |
                    Opcional. Token del enlace público (/c/{token}) por el que llegó la persona.
                    Si es el enlace vigente de la campaña, el aporte se le atribuye (aportes.enlace_id);
                    si no, se ignora sin rechazar el aporte.
      responses:
        "201": { $ref: "#/components/responses/ContributionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: El cuerpo de la petición pasa del archivo más grande permitido }

  /api/c/{token}/aportes:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
        description: Token del enlace público de la campaña (/c/{token})
    post:
      tags: [Aportes]
      summary: Aporte anónimo (sin cuenta) desde un enlace público
      description: |
        Público, sin sesión: es lo único que una persona sin cuenta puede hacer. Solo con un
        enlace vigente de una campaña activa que permita aportes sin cuenta. Con sesión iniciada
        responde 409 (se aporta con la cuenta). El aporte se guarda sin datos personales (`user_id`
        NULL, "Anónimo", sin correo ni nombre de archivo; fotos y documentos sin metadatos) y sin ninguna
        forma de la IP. Cuota: la cuota por persona de la campaña, contada por dispositivo con la
        cookie `anonimo_id` (se crea en la primera respuesta exitosa); además, un tope de 20 aportes
        anónimos por IP por hora, y 60 segundos de espera entre dos aportes del mismo
        dispositivo (en cualquier campaña). Solo responde cuántos aportes le quedan y la espera.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [description, aceptaUso, confirmaContenido]
              properties:
                description: { type: string, maxLength: 1000 }
                aceptaUso:
                  type: string
                  enum: [si]
                  description: Igual que en POST /api/aportes; sin él responde 400
                confirmaContenido:
                  type: string
                  enum: [si]
                  description: Igual que en POST /api/aportes; sin él responde 400
                caracteristicas:
                  type: array
                  items: { type: string }
                  description: 'Respuestas de checklists ("Título: opción"); se descartan las que no existen'
                file:
                  type: string
                  format: binary
                  description: Mismas reglas que en POST /api/aportes (tipos de la campaña; opcional si acepta texto)
      responses:
        "201":
          description: Aporte enviado; queda pendiente de revisión
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      restantes: { type: integer, description: Aportes que aún puede enviar este dispositivo }
                      esperaSegundos: { type: integer, description: Segundos hasta poder enviar otro }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: La campaña no permite aportes sin cuenta, o el dispositivo está bloqueado
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Hay sesión iniciada, o la campaña ya no recibe aportes
        "410":
          description: El enlace caducó o fue reemplazado
        "413": { description: El cuerpo de la petición pasa del archivo más grande permitido }
        "429":
          description: |
            Tope de aportes anónimos por IP alcanzado, o el dispositivo envió otro hace menos de
            60 segundos. En ese caso trae `esperaSegundos` y el encabezado `Retry-After`.

  /api/aportes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Aportes]
      summary: Detalle de aporte
      responses:
        "200":
          description: Aporte
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Contribution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Aportes]
      summary: Editar mi aporte (antes de que entre a revisión)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string, maxLength: 1000 }
                caracteristicas:
                  type: array
                  items: { type: string }
                  description: Solo opciones del checklist de la campaña
      responses:
        "200": { $ref: "#/components/responses/ContributionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Aportes]
      summary: Revisar aporte (creador o revisor aceptado)
      description: |
        Una sola instancia: el creador y el revisor aceptado deciden igual
        (`aceptado` o `rechazado`) y esa decisión es la final: un aporte decidido ya no
        se puede cambiar, ni por el creador ni por el revisor (409). Si deciden a la vez, gana uno.
        Un revisor no puede decidir sobre un aporte que él mismo envió (403).
        La decisión le llega al participante como notificación.
        `rejectionReason` es obligatorio al rechazar. `inapropiado: true` (creador o revisor) marca un aporte
        anónimo como contenido inapropiado al rechazarlo; con 3 marcados en 30 días, el
        dispositivo queda bloqueado 30 días en toda la plataforma (el mensaje lo
        avisa). Si se acepta, se quita la marca.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [aceptado, rechazado] }
                rejectionReason: { type: string }
                inapropiado: { type: boolean, description: Solo con status rechazado y aporte anónimo }
            examples:
              aceptar: { value: { status: aceptado } }
              rechazar: { value: { status: rechazado, rejectionReason: La foto no corresponde a la campaña } }
      responses:
        "200": { $ref: "#/components/responses/ContributionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Aportes]
      summary: Eliminar mi aporte pendiente o rechazado
      description: Uno aceptado ya no se borra (400). Al borrar uno rechazado se recupera ese espacio de la cuota. Borra también su archivo de MinIO y recalcula los contadores de la campaña.
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/aportes/{id}/archivo:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Aportes]
      summary: Descargar el archivo del aporte
      description: |
        Quien aportó, el creador o un revisor aceptado. Fotos, video, audio y texto se muestran en el
        navegador; PDF y Word se descargan (`Content-Disposition: attachment`). Acepta `Range`
        (un solo rango) para que video y audio se puedan adelantar.
      parameters:
        - name: Range
          in: header
          required: false
          schema: { type: string, example: "bytes=0-1023" }
      responses:
        "200":
          description: Contenido del archivo con su tipo real, `X-Content-Type-Options nosniff` y una CSP `sandbox`
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: La parte pedida con `Range`, con `Content-Range`
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "No existe el aporte, o es de solo texto (sin archivo)" }
        "416": { description: "El rango pedido no existe en el archivo" }
        "410":
          description: El creador borró el archivo
    delete:
      tags: [Aportes]
      summary: Borrar el archivo de un aporte anónimo (solo el creador)
      description: Para contenido ilegal o dañino, solo mientras el aporte no tenga decisión. Se borra de MinIO y no se puede recuperar; la fila se conserva. Bitácora `aporte.archivo_borrar`.
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { description: El aporte no es anónimo }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "El archivo ya se había borrado, o el aporte ya está aceptado o rechazado" }

  /api/aportes/{id}/reportar:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Aportes]
      summary: Reportar un aporte a supervisión (revisor aceptado o creador)
      description: |
        El revisor o el creador (desde el 2026-10-19) reportan a quien envió el aporte. Entra a la bandeja
        de Reportes de la supervisión y avisa solo a los supervisores (`reporte_nuevo`); el creador de la
        campaña no recibe aviso (desde el 2026-10-15). Desde el 2026-10-19 **rechaza el aporte** (aunque
        estuviera aceptado; no en una campaña finalizada) y avisa a quien aportó. No banea. Solo aportes con cuenta (anónimo: 400).
        Uno por aporte; se puede antes o después de decidirlo. No se puede reportar un aporte propio.
        Bitácora `aporte.reportar`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, maxLength: 500, description: "Motivo de la lista y/o descripción" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Este aporte ya se reportó a supervisión
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/aportes/{id}/reportar-participante:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Aportes]
      summary: Reportar a la plataforma a quien envió el aporte (creador o revisor aceptado)
      description: |
        Va a Reportes de la supervisión, que lo descarta o lo confirma con un aviso (escala: mensaje,
        2 días, 7 días, baneo y lista negra). Quien aportó no se entera del reporte, pero desde el
        2026-10-19 **el aporte se rechaza** (aunque estuviera aceptado; no en una campaña finalizada). Solo aportes
        con cuenta (anónimo: 400). Uno por persona y aporte. Bitácora `aporte.reportar_participante`.
        Distinto de /reportar ("Reportar a supervisión" del revisor, que también entra a la bandeja).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
                  enum:
                    - Contenido ofensivo o inapropiado
                    - Contenido ilegal o peligroso
                    - Información falsa a propósito
                    - Aportes repetidos o spam
                    - Acoso o amenazas
                descripcion: { type: string, maxLength: 500 }
      responses:
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ya reportaste a quien envió este aporte
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/aportes/{id}/inapropiado:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Aportes]
      summary: Marcar un aporte anónimo como contenido inapropiado (creador o revisor aceptado)
      description: |
        No cambia el estado del aporte. Solo mientras no tenga decisión (409 si ya está aceptado o
        rechazado); también se marca al rechazar con PATCH. Con 3 aportes inapropiados del mismo
        dispositivo en 30 días, el dispositivo queda bloqueado 30 días. Bitácora
        `aporte.inapropiado` (y `sancion.dispositivo_bloquear` si dispara el bloqueo).
      responses:
        "200":
          description: Marcado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      inapropiado: { type: boolean }
                      bloqueoGlobal: { type: boolean }
        "400": { description: El aporte no es anónimo }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: El aporte ya está aceptado o rechazado }

  # ---------------------------------------------------------------- Revisiones y notificaciones
  /api/revisiones:
    get:
      tags: [Revisiones y notificaciones]
      summary: Campañas en las que soy revisor
      description: Ordenadas por la fecha en que aceptaste ser revisor, de la más reciente a la más vieja.
      responses:
        "200":
          description: Campañas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        description: { type: string }
                        status: { $ref: "#/components/schemas/CampaignStatus" }
                        tag: { type: string }
                        goalContributions: { type: integer }
                        pendingContributions: { type: integer, description: Aportes en estado pendiente (los que le tocan al revisor) }
                        participants: { type: integer }
                        currentContributions: { type: integer }
                        creatorName: { type: string }
                        dataTypes: { type: array, items: { type: string, enum: [foto, video, audio, documento, texto] } }
                        endDate: { type: [string, "null"], format: date }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notificaciones:
    get:
      tags: [Revisiones y notificaciones]
      summary: Mis notificaciones (paginadas)
      description: De la más nueva a la más vieja. La campana del TopBar pide `porPagina=8` y vuelve a consultar cada minuto.
      parameters:
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: porPagina, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: filtro, in: query, schema: { type: string, enum: [todas, no-leidas], default: todas } }
      responses:
        "200":
          description: Notificaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  noLeidas: { type: integer, description: Total sin leer (sin importar el filtro ni la página) }
                  limpiables: { type: integer, description: Cuántas borraría DELETE /api/notificaciones (leídas o de más de 30 días) }
                  total: { type: integer, description: Total que cumple el filtro }
                  pagina: { type: integer }
                  porPagina: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Revisiones y notificaciones]
      summary: Marcar todas como leídas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leidas]
              properties:
                leidas: { type: string, enum: [todas] }
      responses:
        "200":
          description: Marcadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  marcadas: { type: integer, description: Cuántas estaban sin leer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Revisiones y notificaciones]
      summary: Limpiar las leídas y las viejas
      description: |
        "Limpiar leídas y viejas" de /notificaciones. Borra las notificaciones ya leídas y, aunque no se
        hayan leído, las de más de 30 días (DIAS_PARA_NOTIFICACION_VIEJA en lib/notificaciones/tipos.ts).
        Una invitación de revisor sin aceptar se conserva. No se puede deshacer.
      responses:
        "200":
          description: Limpiadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  borradas: { type: integer, description: Cuántas se borraron }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/tematicas:
    get:
      tags: [Usuarios]
      summary: Catálogo de temáticas
      description: |
        Las temáticas que se ofrecen como intereses y como temática de campaña: las 23 base en su
        orden y después las que salieron de los textos de los usuarios (hasta el 2026-10-20) ya
        aprobadas, en orden alfabético. Sin las que ocultó el SuperUsuario.
      responses:
        "200":
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: string } }
              example: { data: [Medio ambiente, Salud urbana, Educación, Ajedrez, Fotografía] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: No se pudo leer el catálogo
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/eventos:
    get:
      tags: [Revisiones y notificaciones]
      summary: Actualización en vivo (long polling)
      description: |
        Acepta sesión de usuario o raíz. Sin parámetros, responde al momento con el id de la última
        notificación y la versión de contenido. Con `desde` y `version`, responde en cuanto haya
        notificaciones con id mayor que `desde` o la versión sea otra (cualquier escritura en las tablas
        con trigger `dfg_avisar_cambio`); si no pasa nada, a los 25 s sin novedades. La llama
        components/layout/ActualizacionEnVivo en bucle: con notificaciones actualiza la campana (y
        refresca con un cambio de rol o sanción); con otra versión, las pantallas vuelven a leer.
      parameters:
        - { name: desde, in: query, schema: { type: integer, minimum: 0 } }
        - { name: version, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Novedades (o ninguna, al vencer la espera)
          content:
            application/json:
              schema:
                type: object
                properties:
                  tipos: { type: array, items: { type: string }, description: TipoDeNotificacion de cada una nueva (vacío con sesión raíz) }
                  ultimoId: { type: integer }
                  version: { type: integer, description: "Versión de contenido; si cambió, hay que volver a leer" }
        "204": { description: El cliente cerró la petición antes de que hubiera novedades }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/push:
    get:
      tags: [Revisiones y notificaciones]
      summary: Llave pública VAPID para suscribirse a las notificaciones push
      responses:
        "200":
          description: Llave (null si push no está configurado en el servidor)
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Revisiones y notificaciones]
      summary: Activar los avisos push en este navegador o teléfono
      description: |
        Guarda la suscripción del navegador (PushSubscription.toJSON()) a nombre de la sesión; si ya existía
        con otra persona, pasa a esta. Solo se aceptan endpoints https de servicios de push conocidos
        (Google, Apple, Mozilla, Microsoft). Hasta 10 por persona. Cada notificación se manda también como push.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription]
              properties:
                subscription:
                  type: object
                  properties:
                    endpoint: { type: string, format: uri }
                    keys:
                      type: object
                      properties:
                        p256dh: { type: string }
                        auth: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Revisiones y notificaciones]
      summary: Desactivar los avisos push en este navegador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notificaciones/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Revisiones y notificaciones]
      summary: Marcar una notificación como leída o no leída
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leida]
              properties:
                leida: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Revisiones y notificaciones]
      summary: Borrar una notificación
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Es una invitación de revisor sin aceptar
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/notificaciones/{id}/aceptar:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Revisiones y notificaciones]
      summary: Aceptar una invitación para ser revisor
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La invitación ya no está disponible
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ---------------------------------------------------------------- Datos abiertos
  /api/datos/{id}/descarga:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Datos abiertos]
      summary: Descargar un conjunto de datos abiertos (ZIP)
      description: |
        Solo campañas finalizadas. El ZIP trae los archivos de los aportes aceptados
        (`aporte-001.jpg`...) y la tabla `aportes.csv` (UTF-8 con BOM) con una fila por aporte aceptado,
        también los de solo texto: `aporte`, `archivo`, `usuario` ("Participante N", "Anónimo" o
        "Cuenta eliminada"; nunca nombre ni correo), `campaña`, `ubicación`, `descripción` y
        `tipo de aporte`. Suma 1 a las descargas de la campaña.
      security: []
      responses:
        "200":
          description: Archivo ZIP
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_token
      description: Se obtiene con `POST /api/auth/login`. El navegador la manda sola.
    pendingVerificationCookie:
      type: apiKey
      in: cookie
      name: pending_verification_id
      description: La dejan el registro o un login sin verificar.
    rootBearer:
      type: http
      scheme: bearer
      description: Token del SuperUsuario. Se obtiene con `POST /api/auth/root/token` y vale 2 horas.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Message:
      description: Operación correcta
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    BadRequest:
      description: Datos inválidos
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: No hay sesión (o la cuenta está suspendida o baneada)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Sin permiso para esta acción, o `Origen no permitido`
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No existe
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CampaignResult:
      description: Campaña resultante
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              data: { $ref: "#/components/schemas/Campaign" }
    ContributionResult:
      description: Aporte resultante
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              data: { $ref: "#/components/schemas/Contribution" }
    SavedResult:
      description: Estado de guardado
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  isSaved: { type: boolean }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    CampaignStatus:
      type: string
      enum: [borrador, en_revision, aceptada, activa, pausada, finalizada, rechazada]
    DataType:
      type: string
      enum: [texto, foto, video, audio, documento]
    CollectionMode:
      type: string
      enum: [checklist, texto_libre]
    ChecklistSeccion:
      type: object
      required: [titulo, opciones]
      properties:
        titulo: { type: string, maxLength: 120 }
        opciones: { type: array, minItems: 1, items: { type: string, maxLength: 120 } }
    ContributionStatus:
      type: string
      enum: [pendiente, espera_final, aceptado, rechazado]

    User:
      type: object
      properties:
        id: { type: string }
        nombre: { type: string }
        apellidos: { type: string }
        email: { type: string }
        state: { type: string }
        city: { type: string }
        specialty: { type: string }
        intereses: { type: array, items: { type: string } }
        intereses_texto: { type: [string, "null"], description: "Lo que escribió sobre sus gustos" }
        role: { type: string, enum: [usuario, supervisor, revisor, admin] }
        xpTotal: { type: integer }
        level: { type: integer }
        streakDays: { type: integer }

    RegistroInput:
      type: object
      required: [nombre, apellidos, email, password]
      properties:
        nombre: { type: string }
        apellidos: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, description: "Al menos 8 caracteres (máximo 72 bytes), una mayúscula, un número y un carácter especial" }
        state: { type: string }
        city: { type: string }
        specialty: { type: string }
        intereses: { type: array, items: { type: string }, description: "Solo temáticas que ya existen en el catálogo; las demás se ignoran" }
      example:
        nombre: Ana
        apellidos: Pérez López
        email: ana@correo.com
        password: Contraseña123!
        state: Nayarit
        city: Tepic
        specialty: ""
        intereses: [Medio ambiente]

    CampaignInput:
      type: object
      required: [name, description, tematica, dataTypes, goalContributions, quotaPerUser, startDate, endDate, locationState]
      properties:
        name: { type: string }
        description: { type: string }
        tematica: { type: string }
        status: { $ref: "#/components/schemas/CampaignStatus" }
        dataTypes: { type: array, minItems: 1, items: { $ref: "#/components/schemas/DataType" } }
        checklistSecciones:
          type: array
          description: >-
            Checklists con título que el participante marca además de la descripción (siempre obligatoria).
            Pueden ser cero o varios. Cada uno necesita título y al menos una opción; los títulos no se repiten.
            Hasta 50 checklists de 50 opciones, 120 caracteres por texto. Las respuestas del aporte se guardan como "Título: opción".
            Por compatibilidad, un `checklistOpciones` (lista plana) se guarda como un checklist titulado "Checklist".
          items: { $ref: "#/components/schemas/ChecklistSeccion" }
        goalContributions: { type: integer, minimum: 1 }
        quotaPerUser: { type: integer, minimum: 1 }
        cuotaPorTipo:
          type: [object, "null"]
          description: |
            Reparto de quotaPerUser por tipo de dato, con dos tipos o más (p. ej. foto y audio con cuota 10 →
            `{ "foto": 5, "audio": 5 }`). Fuera de borrador es obligatorio con dos tipos o más: cada tipo de
            `dataTypes` con al menos 1 y la suma igual a quotaPerUser (400 si no). Con un tipo se ignora (null).
            En el PATCH se revisa si llega este campo, la cuota o los tipos; las campañas activas, pausadas o
            aceptadas no lo cambian.
          additionalProperties: { type: integer, minimum: 1 }
          example: { foto: 5, audio: 5 }
        startDate: { type: string, format: date }
        startTime: { type: string, example: "08:00" }
        endDate: { type: string, format: date }
        endTime: { type: string, example: "20:00" }
        locationState: { type: string }
        locationCity: { type: string, description: "Municipio. Opcional: vacío, la campaña abarca todo el estado" }
        locationColonia: { type: string, description: "Solo con municipio; sin él se guarda vacía" }
        todoElPais:
          type: boolean
          description: |
            Para todo el país (2026-10-21): se guardan vacíos estado, municipio y colonia aunque lleguen, y fuera
            de borrador ya no se exige el estado. Sale en el filtro por estado de /explorar y /datos, y el aviso de
            campaña nueva llega a quien tenga la temática, viva donde viva.
        organizer: { type: string }
      example:
        name: Baches en Tepic
        description: Fotos de baches en calles de la ciudad
        tematica: infraestructura
        status: en_revision
        dataTypes: [foto]
        checklistSecciones:
          - titulo: Tamaño del bache
            opciones: [Chico, Mediano, Grande]
          - titulo: Riesgo
            opciones: [Para autos, Para peatones]
        goalContributions: 100
        quotaPerUser: 5
        startDate: "2026-10-01"
        startTime: "08:00"
        endDate: "2026-10-31"
        endTime: "20:00"
        locationState: Nayarit
        locationCity: Tepic
        locationColonia: ""
        organizer: ""

    Campaign:
      type: object
      properties:
        id: { type: string }
        creatorId: { type: string }
        creatorName: { type: string }
        name: { type: string }
        description: { type: string }
        tag: { type: string }
        tematica: { type: string }
        status: { $ref: "#/components/schemas/CampaignStatus" }
        dataTypes: { type: array, items: { $ref: "#/components/schemas/DataType" } }
        collectionMode: { $ref: "#/components/schemas/CollectionMode", description: "Obsoleto: se deriva de checklistSecciones" }
        checklistOpciones: { type: array, items: { type: string }, description: "Obsoleto: usa checklistSecciones" }
        checklistSecciones: { type: array, items: { $ref: "#/components/schemas/ChecklistSeccion" } }
        goalContributions: { type: integer }
        quotaPerUser: { type: integer }
        cuotaPorTipo:
          type: [object, "null"]
          description: Reparto de quotaPerUser por tipo de dato; null = solo la cuota general (campañas de antes o con un tipo).
          additionalProperties: { type: integer }
        currentContributions: { type: integer }
        approvedContributions: { type: integer }
        pendingContributions: { type: integer }
        rejectedContributions: { type: integer }
        participants: { type: integer }
        startDate: { type: [string, "null"], format: date }
        startTime: { type: [string, "null"] }
        endDate: { type: [string, "null"], format: date }
        endTime: { type: [string, "null"] }
        locationCity: { type: string }
        locationState: { type: string }
        locationColonia: { type: string }
        todoElPais: { type: boolean, description: "Para todo el país; estado, municipio y colonia vacíos" }
        organizer: { type: string }
        xpPerContribution: { type: integer }
        isSpecial: { type: boolean }
        daysRemaining: { type: [integer, "null"] }
        hasReviewerAssigned: { type: boolean }
        isSaved: { type: boolean, description: Solo con sesión }
        isBanned: { type: boolean, description: "Solo con sesión: el creador te baneó de esta campaña" }
        myContributionsCount: { type: integer, description: Solo con `misAportes=true` }

    Contribution:
      type: object
      properties:
        id: { type: string }
        campaignId: { type: string }
        campaignName: { type: string }
        userId: { type: [string, "null"], description: null = aporte anónimo }
        participantName: { type: string }
        participantEmail: { type: string }
        description: { type: string }
        fileType: { $ref: "#/components/schemas/DataType" }
        fileSizeBytes: { type: integer }
        caracteristicas: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/ContributionStatus" }
        canReview: { type: boolean, description: Si la sesión actual puede revisar este aporte }
        submittedAt: { type: string, format: date-time }
        rejectionReason: { type: string }
        firstPassBy: { type: string }
        firstPassByUserId: { type: string }
        inapropiado: { type: boolean, description: Aporte anónimo marcado como contenido inapropiado }
        archivoBorrado: { type: boolean, description: El creador borró el archivo }
        dispositivoBloqueadoId: { type: [string, "null"], description: "Solo al creador, en aportes anónimos: bloqueo del dispositivo en la campaña" }

    Notification:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          description: Evento que la generó (TipoDeNotificacion en lib/notificaciones/tipos.ts)
          enum: [aporte_aceptado, aporte_rechazado, campana_baneo, campana_desbaneo, campana_aceptada, campana_rechazada, campana_reportada, campana_iniciada, campana_nueva, campana_especial, recordatorio_semanal, resumen_mensual, campana_finalizada, revisor_acepto, aporte_reportado, invitacion_revisor, rol_asignado, rol_revocado, sancion_aplicada, sancion_restaurada]
        title: { type: string }
        message: { type: string }
        campaignId: { type: [string, "null"] }
        campaignName: { type: [string, "null"] }
        href: { type: [string, "null"], description: "Ruta de la app (sin basePath) a la que lleva al abrirla" }
        invitationPending: { type: boolean, description: "Solo en invitacion_revisor: sigue sin aceptar" }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
